[project]
name = "hospital-backend"
version = "0.1.0"
description = "Hospital ERP backend - Django + Django Ninja"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "django-ninja>=1.3,<2.0",
    "django-cors-headers>=4.4",
    "python-dotenv>=1.0",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
